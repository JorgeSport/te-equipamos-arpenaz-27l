name: Publicar landing en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activar vencimiento automático de la promoción
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('gh-pages/escape-500-rolltop/index.html')
          html = target.read_text(encoding='utf-8')
          tag = '<script src="../auto-expiry.js"></script>'
          if tag not in html:
              html = html.replace('</body>', tag + '</body>', 1)
              target.write_text(html, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: gh-pages
      - id: deployment
        uses: actions/deploy-pages@v4
